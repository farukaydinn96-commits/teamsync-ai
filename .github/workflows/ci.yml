name: TeamSync AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Backend Unit Tests (Rate Limiter, Deduplication, RBAC)
        run: node --test backend/tests/workspace.test.js
      - name: Install & Build Frontend
        working-directory: frontend
        run: |
          npm install
          npm run build
