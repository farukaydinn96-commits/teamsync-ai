name: TeamSync AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Backend Dependencies & Run Unit Tests
        working-directory: backend
        run: |
          npm install
          npm test
      - name: Install & Build Frontend
        working-directory: frontend
        run: |
          npm install
          npm run build
